version: "3"

tasks:
  build:
    summary: Builds the application
    cmds:
      - go tool github.com/egoist/mygo/cmd/mygo build

  dev:
    summary: Runs the application in development mode
    cmds:
      - go tool github.com/egoist/mygo/cmd/mygo dev

  test:
    summary: Runs all tests
    cmds:
      - go test ./...

  vet:
    summary: Runs mygo vet and mygo migrte-ui
    cmds:
      - go tool github.com/egoist/mygo/cmd/mygo vet .
      - go tool github.com/egoist/mygo/cmd/mygo migrate-ui -write .

  gen:
    summary: Regenerate bindings (if any)
    cmds:
      - go generate

  clear:
    summary: Delete generated files
    cmds:
      - rm -rf build
      - rm -rf bin
