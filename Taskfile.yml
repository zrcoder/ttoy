version: "3"

tasks:
  build:
    cmds:
      - go tool mygo build

  dev:
    cmds:
      - go tool mygo dev

  test:
    summary: Runs all tests
    cmds:
      - go test ./...

  vet:
    cmds:
      - go tool mygo vet .
      - go vet ./...
  fix:
    cmds:
      - go tool mygo migrate-ui -write .
      - go fix ./...

  gen:
    summary: Regenerate bindings (if any)
    cmds:
      - go generate

  clean:
    cmds:
      - rm -rf build
      - rm -rf bin
